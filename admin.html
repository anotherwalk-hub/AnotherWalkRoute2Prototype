<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AnotherWalk — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --parchment:  #f1eade;
      --parchment2: #e8e0cf;
      --carbon:     #191919;
      --bordeaux:   #701321;
      --bordeaux-l: #8e1a2b;
      --gold:       #b89a5a;
      --white:      #ffffff;
      --success:    #2d6a4f;
      --danger:     #c0392b;
      --shadow:     rgba(25,25,25,0.10);
      --font-head:  'Playfair Display', Georgia, serif;
      --font-body:  'Montserrat', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); background: var(--parchment); color: var(--carbon); min-height: 100vh; font-size: 14px; }

    /* ── AUTH ── */
    #auth-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .auth-card { background: var(--white); border: 1px solid var(--parchment2); border-radius: 4px; padding: 48px 40px; width: min(360px, 92vw); box-shadow: 0 4px 24px var(--shadow); text-align: center; }
    .auth-card .logo { font-family: var(--font-head); font-size: 26px; color: var(--bordeaux); margin-bottom: 4px; }
    .auth-card .subtitle { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin-bottom: 32px; }
    .auth-card p { color: #666; margin-bottom: 24px; line-height: 1.6; font-size: 13px; }

    /* ── BUTTONS ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-body); font-weight: 600; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; border: none; border-radius: 2px; cursor: pointer; transition: all 0.18s; padding: 11px 22px; -webkit-tap-highlight-color: transparent; }
    .btn-primary { background: var(--bordeaux); color: var(--white); }
    .btn-primary:active { background: var(--bordeaux-l); }
    .btn-ghost { background: transparent; color: var(--bordeaux); border: 1px solid var(--bordeaux); }
    .btn-ghost:active { background: var(--bordeaux); color: var(--white); }
    .btn-sm { font-size: 11px; padding: 8px 14px; }

    /* ── APP ── */
    #app { display: none; flex-direction: column; min-height: 100vh; }

    /* ── HEADER ── */
    header { background: var(--carbon); color: var(--white); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.3); }
    .header-logo { font-family: var(--font-head); font-size: 18px; color: var(--white); }
    .header-logo span { color: var(--bordeaux); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; margin-left: 8px; vertical-align: middle; border: 1px solid var(--bordeaux); padding: 2px 6px; border-radius: 1px; }
    .header-right { display: flex; align-items: center; gap: 10px; font-size: 11px; color: rgba(255,255,255,0.5); }
    .header-email { display: none; color: var(--white); font-weight: 600; }
    @media (min-width: 480px) { .header-email { display: inline; } }

    /* ── MAIN ── */
    main { flex: 1; max-width: 900px; margin: 0 auto; padding: 24px 16px; width: 100%; }
    .page-title { font-family: var(--font-head); font-size: 24px; color: var(--bordeaux); margin-bottom: 2px; }
    .page-subtitle { font-size: 11px; color: #888; letter-spacing: 0.05em; margin-bottom: 24px; }

    /* ── STATS ── */
    .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
    .stat-card { background: var(--white); border: 1px solid var(--parchment2); border-radius: 4px; padding: 16px; box-shadow: 0 2px 8px var(--shadow); text-align: center; }
    .stat-value { font-family: var(--font-head); font-size: 28px; color: var(--bordeaux); line-height: 1; margin-bottom: 4px; }
    .stat-label { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: #888; }

    /* ── SECTION ── */
    .section { background: var(--white); border: 1px solid var(--parchment2); border-radius: 4px; box-shadow: 0 2px 8px var(--shadow); margin-bottom: 20px; overflow: hidden; }
    .section-header { padding: 14px 16px; border-bottom: 1px solid var(--parchment2); display: flex; align-items: center; justify-content: space-between; }
    .section-title { font-family: var(--font-head); font-size: 15px; color: var(--carbon); }

    /* ── USER CARDS ── */
    .user-card { padding: 16px; border-bottom: 1px solid var(--parchment); }
    .user-card:last-child { border-bottom: none; }
    .user-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .user-email { font-weight: 600; font-size: 13px; color: var(--carbon); word-break: break-all; }
    .user-id { font-size: 10px; color: #ccc; font-family: monospace; margin-top: 2px; }
    .user-role-badge { flex-shrink: 0; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: rgba(184,154,90,0.12); color: var(--gold); border: 1px solid rgba(184,154,90,0.3); }

    /* ── BADGES ── */
    .route-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 5px 10px; border-radius: 20px; font-weight: 500; }
    .badge-active { background: #eaf4ef; color: var(--success); border: 1px solid #b2d8c4; }
    .badge-none { background: var(--parchment); color: #aaa; font-style: italic; }
    .badge-remove { cursor: pointer; color: #aaa; font-weight: 700; padding: 0; background: none; border: none; font-size: 14px; line-height: 1; min-width: 22px; min-height: 22px; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
    .badge-remove:active { color: var(--danger); }

    /* ── ASSIGN BUTTON ── */
    .btn-assign { display: inline-flex; align-items: center; gap: 6px; background: transparent; color: var(--bordeaux); border: 1px solid rgba(112,19,33,0.25); border-radius: 20px; font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; padding: 8px 16px; cursor: pointer; transition: all 0.18s; -webkit-tap-highlight-color: transparent; }
    .btn-assign:active { background: var(--bordeaux); color: var(--white); border-color: var(--bordeaux); }

    /* ── BOTTOM SHEET ── */
    .sheet-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(25,25,25,0.55); backdrop-filter: blur(3px); opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .sheet-overlay.open { opacity: 1; pointer-events: all; }
    .sheet { position: fixed; bottom: 0; left: 0; right: 0; z-index: 501; background: var(--white); border-radius: 16px 16px 0 0; transform: translateY(100%); transition: transform 0.32s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 -8px 40px rgba(25,25,25,0.18); max-height: 80vh; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .sheet.open { transform: translateY(0); }
    .sheet-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 12px auto 0; flex-shrink: 0; }
    .sheet-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--parchment2); flex-shrink: 0; }
    .sheet-title { font-family: var(--font-head); font-size: 17px; color: var(--carbon); margin-bottom: 2px; }
    .sheet-subtitle { font-size: 11px; color: #888; word-break: break-all; }
    .sheet-body { padding: 8px 0; overflow-y: auto; flex: 1; }
    .route-option { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid var(--parchment); cursor: pointer; -webkit-tap-highlight-color: transparent; transition: background 0.12s; }
    .route-option:last-child { border-bottom: none; }
    .route-option:active { background: #faf8f4; }
    .route-option-name { font-weight: 600; font-size: 13px; color: var(--carbon); }
    .route-option-city { font-size: 11px; color: #888; margin-top: 2px; }
    .route-option-arrow { color: var(--bordeaux); font-size: 16px; opacity: 0.5; flex-shrink: 0; }

    /* ── TOAST ── */
    #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(10px); background: var(--carbon); color: var(--white); padding: 12px 20px; border-radius: 24px; font-size: 13px; font-family: var(--font-body); box-shadow: 0 4px 20px rgba(0,0,0,0.25); opacity: 0; transition: all 0.22s ease; pointer-events: none; z-index: 9999; white-space: nowrap; max-width: 90vw; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.toast-success { border-left: 3px solid #5dbf8a; }
    #toast.toast-error { border-left: 3px solid var(--danger); }

    .loading-msg { text-align: center; color: #aaa; padding: 32px; font-style: italic; font-size: 13px; }

    /* ── ACCESS DENIED ── */
    #access-denied { display: none; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 24px; }
    .denied-card { background: var(--white); border: 1px solid var(--parchment2); border-radius: 4px; padding: 40px 32px; box-shadow: 0 4px 24px var(--shadow); max-width: 320px; }
    .denied-card .icon { font-size: 36px; margin-bottom: 14px; }
    .denied-card h2 { font-family: var(--font-head); color: var(--bordeaux); margin-bottom: 8px; }
    .denied-card p { color: #666; font-size: 13px; margin-bottom: 20px; }
  </style>
</head>
<body>

<div id="auth-screen">
  <div class="auth-card">
    <div class="logo">AnotherWalk</div>
    <div class="subtitle">Admin Panel</div>
    <p>Log in met je admin-account om door te gaan.</p>
    <button class="btn btn-primary" onclick="signIn()">Inloggen met Magic Link</button>
    <div id="auth-msg" style="margin-top:16px;font-size:12px;color:#888;"></div>
  </div>
</div>

<div id="access-denied">
  <div class="denied-card">
    <div class="icon">🔒</div>
    <h2>Geen toegang</h2>
    <p>Dit account heeft geen admin-rechten.</p>
    <button class="btn btn-ghost" onclick="signOut()">Uitloggen</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-logo">AnotherWalk <span>Admin</span></div>
    <div class="header-right">
      <span class="header-email" id="admin-email"></span>
      <button class="btn btn-ghost btn-sm" onclick="signOut()">Uitloggen</button>
    </div>
  </header>

  <main>
    <h1 class="page-title">Gebruikers</h1>
    <p class="page-subtitle">Beheer toegang tot routes</p>

    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-value" id="stat-users">—</div>
        <div class="stat-label">Gebruikers</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-routes">—</div>
        <div class="stat-label">Routes</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-assignments">—</div>
        <div class="stat-label">Toegewezen</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <span class="section-title">Alle gebruikers</span>
        <button class="btn btn-ghost btn-sm" onclick="loadData()">↺ Vernieuwen</button>
      </div>
      <div id="users-list">
        <div class="loading-msg">Gebruikers laden…</div>
      </div>
    </div>
  </main>
</div>

<!-- Bottom sheet -->
<div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
<div class="sheet" id="assignSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <div class="sheet-title">Route toewijzen</div>
    <div class="sheet-subtitle" id="sheetSubtitle"></div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div id="toast"></div>

<script>
  const SUPABASE_URL  = 'https://wsutcrdespetoutyuddy.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzdXRjcmRlc3BldG91dHl1ZGR5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NDk0MDQsImV4cCI6MjA5NDQyNTQwNH0.vDUwFtgcpRY7AimSytoGeK7Rl1779_0ivXGWB0sG6KQ';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON);

  let allRoutes = [];
  let currentSession = null;

  // ── AUTH
  async function signIn() {
    const email = prompt('Vul je admin e-mailadres in:');
    if (!email) return;
    const { error } = await db.auth.signInWithOtp({
      email,
      options: { emailRedirectTo: 'https://anotherwalk-hub.github.io/AnotherWalkRoute2Prototype/admin.html' }
    });
    document.getElementById('auth-msg').textContent = error
      ? '❌ ' + error.message
      : '✉️ Check je inbox voor de magic link.';
  }

  async function signOut() { await db.auth.signOut(); location.reload(); }

  async function isAdmin(userId) {
    const { data } = await db.from('profiles').select('role').eq('id', userId).single();
    return data?.role === 'admin';
  }

  function show(id) {
    ['auth-screen','access-denied','app'].forEach(s => document.getElementById(s).style.display = 'none');
    document.getElementById(id).style.display = 'flex';
  }

  function toast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show toast-${type}`;
    setTimeout(() => t.className = '', 3000);
  }

  // ── SHEET
  function openSheet(userId, userEmail, unassigned) {
    document.getElementById('sheetSubtitle').textContent = userEmail;
    const body = document.getElementById('sheetBody');
    if (unassigned.length === 0) {
      body.innerHTML = '<p style="color:#aaa;font-style:italic;font-size:13px;text-align:center;padding:24px;">Alle routes zijn al toegewezen.</p>';
    } else {
      body.innerHTML = unassigned.map(r => `
        <div class="route-option" onclick="assignRoute('${userId}','${r.id}','${userEmail}','${r.name}')">
          <div>
            <div class="route-option-name">${r.name}</div>
            <div class="route-option-city">${r.city || ''}</div>
          </div>
          <div class="route-option-arrow">→</div>
        </div>
      `).join('');
    }
    document.getElementById('assignSheet').classList.add('open');
    document.getElementById('sheetOverlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeSheet() {
    document.getElementById('assignSheet').classList.remove('open');
    document.getElementById('sheetOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }

  // Swipe down to close sheet
  let touchStartY = 0;
  document.getElementById('assignSheet').addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; }, { passive: true });
  document.getElementById('assignSheet').addEventListener('touchend', e => {
    if (e.changedTouches[0].clientY - touchStartY > 60) closeSheet();
  }, { passive: true });

  // ── DATA
  async function loadData() {
    document.getElementById('users-list').innerHTML = '<div class="loading-msg">Laden…</div>';

    const { data: routes } = await db.from('routes').select('*').order('sort_order');
    allRoutes = routes || [];

    const { data: profiles, error: pErr } = await db.from('profiles').select('*');
    if (pErr) { toast('Fout: ' + pErr.message, 'error'); return; }

    const { data: userRoutes, error: urErr } = await db.from('user_routes').select('*');
    if (urErr) { toast('Fout: ' + urErr.message, 'error'); return; }

    document.getElementById('stat-users').textContent = (profiles || []).length;
    document.getElementById('stat-routes').textContent = allRoutes.length;
    document.getElementById('stat-assignments').textContent = (userRoutes || []).length;

    const userRouteMap = {};
    (userRoutes || []).forEach(ur => {
      if (!userRouteMap[ur.user_id]) userRouteMap[ur.user_id] = [];
      userRouteMap[ur.user_id].push(ur);
    });

    const list = document.getElementById('users-list');
    if (!profiles || profiles.length === 0) {
      list.innerHTML = '<div class="loading-msg">Geen gebruikers gevonden.</div>';
      return;
    }

    list.innerHTML = '';
    profiles.forEach(profile => {
      const assigned = userRouteMap[profile.id] || [];
      const assignedIds = assigned.map(ur => String(ur.route_id));
      const unassigned = allRoutes.filter(r => !assignedIds.includes(String(r.id)));

      const card = document.createElement('div');
      card.className = 'user-card';

      // Top: email + role badge
      const top = document.createElement('div');
      top.className = 'user-card-top';
      top.innerHTML = `
        <div>
          <div class="user-email">${profile.email || '—'}</div>
          <div class="user-id">${profile.id.slice(0,18)}…</div>
        </div>
        ${profile.role === 'admin' ? '<span class="user-role-badge">Admin</span>' : ''}
      `;
      card.appendChild(top);

      // Badges
      const badgesDiv = document.createElement('div');
      badgesDiv.className = 'route-badges';
      if (assigned.length === 0) {
        badgesDiv.innerHTML = '<span class="badge badge-none">Geen routes</span>';
      } else {
        assigned.forEach(ur => {
          const route = allRoutes.find(r => String(r.id) === String(ur.route_id));
          const name = route ? route.name : ur.route_id;
          const src = ur.source === 'admin' ? ' · admin' : ur.source === 'stripe' ? ' · betaald' : '';
          const b = document.createElement('span');
          b.className = 'badge badge-active';
          b.innerHTML = `${name}<span style="opacity:.5;font-weight:400">${src}</span><button class="badge-remove" onclick="revokeAccess('${profile.id}','${ur.route_id}','${name}')">×</button>`;
          badgesDiv.appendChild(b);
        });
      }
      card.appendChild(badgesDiv);

      // Assign button or done message
      if (unassigned.length > 0) {
        const btn = document.createElement('button');
        btn.className = 'btn-assign';
        btn.innerHTML = '+ Route toewijzen';
        btn.onclick = () => openSheet(profile.id, profile.email, unassigned);
        card.appendChild(btn);
      } else {
        const done = document.createElement('span');
        done.style.cssText = 'font-size:11px;color:#bbb;font-style:italic;';
        done.textContent = 'Alle routes toegewezen ✓';
        card.appendChild(done);
      }

      list.appendChild(card);
    });
  }

  // ── ASSIGN
  async function assignRoute(userId, routeId, userEmail, routeName) {
    closeSheet();
    const { error } = await db.from('user_routes').insert({ user_id: userId, route_id: routeId, source: 'admin' });
    if (error) toast('Fout: ' + error.message, 'error');
    else { toast(`✓ "${routeName}" toegewezen`); loadData(); }
  }

  // ── REVOKE
  async function revokeAccess(userId, routeId, routeName) {
    if (!confirm(`Toegang tot "${routeName}" intrekken?`)) return;
    const { error } = await db.from('user_routes').delete().eq('user_id', userId).eq('route_id', routeId);
    if (error) toast('Fout: ' + error.message, 'error');
    else { toast(`✓ Toegang ingetrokken`); loadData(); }
  }

  // ── INIT
  async function init() {
    const { data: { session } } = await db.auth.getSession();
    currentSession = session;
    if (!session) { show('auth-screen'); return; }
    const admin = await isAdmin(session.user.id);
    if (!admin) { show('access-denied'); return; }
    document.getElementById('admin-email').textContent = session.user.email;
    show('app');
    loadData();
  }

  db.auth.onAuthStateChange((_event, session) => {
    if (session && !currentSession) { currentSession = session; init(); }
  });

  init();
</script>
</body>
</html>
